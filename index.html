    <label class="block text-xs font-semibold text-slate-400 mb-1">My Gender</label>
            <select id="obGender" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm focus:border-brand-500 focus:outline-none text-slate-200">
              <option value="">Man</op      ? 'Log In to Spark' 
        : 'Create My Account';
      document.querySelector('[id="auth18Wrapper"]').classList.toggle('hidden', mode === 'login');
    }

    function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const is18Checked = document.getElementById('auth18Check').checked;
      
      if (!email || !password) {
        showToast('Please fill in all fields', 'fa-exclamation', 2000);
        return;
      }

      if (appState.authMode === 'signup' && !is18Checked) {
        showToast('You must be 18+ to join', 'fa-exclamation', 2000);
        return;
      }

      appState.isLoggedIn = true;
      appState.currentUser = { email, password, avatar: avatarOptions[0] };
      
      showToast(appState.authMode === 'login' ? 'Welcome back!' : 'Account created!', 'fa-heart', 1500);
      setTimeout(() => switchScreen('onboarding'), 500);
    }

    // ========================================== 
    // ONBOARDING
    // ========================================== 
    function populateAvatarPicker() {
      const grid = document.getElementById('avatarPickerGrid');
      grid.innerHTML = '';
      
      avatarOptions.forEach((url, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full aspect-square rounded-2xl border-2 overflow-hidden transition ${i === 0 ? 'border-brand-500' : 'border-slate-700 hover:border-brand-500/50'}`;
        btn.innerHTML = `<img src="${url}" alt="Avatar ${i+1}" class="w-full h-full object-cover">`;
        btn.onclick = () => {
          document.querySelectorAll('#avatarPickerGrid button').forEach(b => {
            b.classList.remove('border-brand-500');
            b.classList.add('border-slate-700');
          });
          btn.classList.add('border-brand-500');
          appState.currentUser.avatar = url;
        };
        grid.appendChild(btn);
      });
    }

    function populateInterestTags() {
      const container = document.getElementById('interestTagsContainer');
      container.innerHTML = '';
      
      interestTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'px-4 py-2 rounded-full text-xs font-semibold border transition bg-slate-900 border-slate-700 text-slate-300 hover:border-brand-500 hover:text-brand-400';
        btn.textContent = tag;
        btn.onclick = () => {
          btn.classList.toggle('bg-brand-500/20');
          btn.classList.toggle('border-brand-500');
          btn.classList.toggle('text-brand-400');
          btn.classList.toggle('bg-slate-900');
          btn.classList.toggle('border-slate-700');
          btn.classList.toggle('text-slate-300');
        };
        container.appendChild(btn);
      });
    }

    function nextOnboardStep() {
      if (appState.onboardingStep < 3) {
        appState.onboardingStep++;
        updateOnboardingUI();
      } else {
        skipOnboardingToApp();
      }
    }

    function prevOnboardStep() {
      if (appState.onboardingStep > 1) {
        appState.onboardingStep--;
        updateOnboardingUI();
      }
    }

    function updateOnboardingUI() {
      document.querySelectorAll('.onboard-step').forEach(s => s.classList.add('hidden'));
      document.getElementById('onboardStep' + appState.onboardingStep).classList.remove('hidden');
      
      document.getElementById('onboardStepBadge').textContent = `Step ${appState.onboardingStep} of 3`;
      document.getElementById('onboardProgressBar').style.width = (appState.onboardingStep / 3 * 100) + '%';
      document.getElementById('obBackBtn').classList.toggle('hidden', appState.onboardingStep === 1);
      document.getElementById('obNextBtn').textContent = appState.onboardingStep === 3 ? 'Complete Setup' : 'Continue';
    }

    function skipOnboardingToApp() {
      appState.currentUser = {
        ...appState.currentUser,
        name: document.getElementById('obName').value || 'Alex Rivera',
        age: document.getElementById('obAge').value || 26,
        gender: document.getElementById('obGender').value || 'Woman',
        city: document.getElementById('obCity').value || 'New York, NY',
        bio: document.getElementById('obBio').value || 'Architectural designer and creative soul',
        job: document.getElementById('obJob').value || 'Urban Architect',
      };
      
      document.getElementById('profileUserName').textContent = appState.currentUser.name;
      document.getElementById('profileUserAge').textContent = `${appState.currentUser.age} • ${appState.currentUser.city}`;
      document.getElementById('profileUserAvatar').src = appState.currentUser.avatar;
      document.getElementById('navUserAvatar').src = appState.currentUser.avatar;
      
      loadProfileDeck();
      loadMatches();
      switchScreen('app');
      showToast('Welcome to Spark! 🔥', 'fa-fire', 2000);
    }

    function detectGeoLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          showToast('📍 Location detected', 'fa-location-dot', 1500);
        }, () => {
          showToast('Unable to access location', 'fa-exclamation', 2000);
        });
      }
    }

    function selectPrefGender(btn, gender) {
      document.querySelectorAll('.pref-gender-btn').forEach(b => {
        b.classList.remove('border-brand-500', 'bg-brand-500/20', 'text-brand-400');
        b.classList.add('border-slate-700', 'bg-slate-900', 'text-slate-400');
      });
      btn.classList.add('border-brand-500', 'bg-brand-500/20', 'text-brand-400');
      btn.classList.remove('border-slate-700', 'bg-slate-900', 'text-slate-400');
    }

    // ========================================== 
    // DISCOVER / SWIPING
    // ========================================== 
    function loadProfileDeck() {
      const deck = document.getElementById('cardDeck');
      deck.innerHTML = '';
      appState.currentCardIndex = 0;
      renderCardStack();
    }

    function renderCardStack() {
      const deck = document.getElementById('cardDeck');
      
      if (appState.currentCardIndex >= profileDatabase.length) {
        document.getElementById('emptyDeckState').classList.remove('hidden');
        return;
      }

      document.getElementById('emptyDeckState').classList.add('hidden');
      
      // Show up to 2 cards
      for (let i = 0; i < Math.min(2, profileDatabase.length - appState.currentCardIndex); i++) {
        const profile = profileDatabase[appState.currentCardIndex + i];
        const card = document.createElement('div');
        card.className = `absolute inset-0 rounded-3xl overflow-hidden card-shadow transition-all duration-300 ${i === 0 ? 'z-10' : 'z-0 scale-95 translate-y-4'}`;
        card.innerHTML = `
          <img src="${profile.avatar}" alt="${profile.name}" class="w-full h-full object-cover">
          <div class="gradient-overlay absolute inset-0"></div>
          <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
            <div class="flex items-end justify-between">
              <div>
                <h3 class="text-3xl font-extrabold">${profile.name}, ${profile.age}</h3>
                <p class="text-sm text-slate-200 mt-1"><i class="fa-solid fa-location-dot text-brand-400 mr-1"></i>${profile.city}</p>
                <p class="text-xs text-slate-300 mt-2">${profile.bio}</p>
              </div>
              ${profile.verified ? '<div class="text-brand-400 text-2xl"><i class="fa-solid fa-badge-check"></i></div>' : ''}
            </div>
          </div>
        `;
        deck.appendChild(card);
      }
    }

    function swipeCard(direction) {
      const cards = document.querySelectorAll('#cardDeck > div');
      if (cards.length === 0) return;
      
      const activeCard = cards[0];
      
      if (direction === 'left') {
        activeCard.classList.add('animate-swipe-left');
        showToast('Passed', 'fa-xmark', 1000);
      } else if (direction === 'right') {
        activeCard.classList.add('animate-swipe-right');
        showToast('Liked! 💙', 'fa-heart', 1000);
        
        // Add to matches
        appState.matches.push(profileDatabase[appState.currentCardIndex]);
      } else if (direction === 'super') {
        activeCard.classList.add('animate-swipe-right');
        showToast('Super Liked! ⭐', 'fa-star', 1000);
        appState.matches.push(profileDatabase[appState.currentCardIndex]);
      }
      
      appState.swipeHistory.push({
        profile: profileDatabase[appState.currentCardIndex],
        action: direction,
        timestamp: new Date(),
      });
      
      appState.currentCardIndex++;
      setTimeout(() => renderCardStack(), 500);
    }

    function handleRewind() {
      if (appState.swipeHistory.length === 0) {
        showToast('No more rewinded profiles', 'fa-undo', 1500);
        return;
      }
      
      const lastSwipe = appState.swipeHistory.pop();
      appState.currentCardIndex--;
      
      if (lastSwipe.action === 'right' || lastSwipe.action === 'super') {
        appState.matches = appState.matches.filter(m => m.id !== lastSwipe.profile.id);
      }
      
      renderCardStack();
      showToast('Rewinded!', 'fa-undo', 1000);
    }

    function resetProfileDeck() {
      appState.currentCardIndex = 0;
      appState.swipeHistory = [];
      appState.matches = [];
      loadProfileDeck();
      showToast('Deck refreshed!', 'fa-rotate-right', 1500);
    }

    // ========================================== 
    // MATCHES & MESSAGES
    // ========================================== 
    function loadMatches() {
      const newMatchesScroll = document.getElementById('newMatchesScroll');
      const messagesList = document.getElementById('messagesList');
      
      newMatchesScroll.innerHTML = '';
      messagesList.innerHTML = '';
      
      // Show recent matches
      const recentMatches = appState.matches.slice(-5).reverse();
      
      if (recentMatches.length === 0) {
        newMatchesScroll.innerHTML = '<div class="text-xs text-slate-500 py-8 text-center">No matches yet. Start swiping!</div>';
        messagesList.innerHTML = '<div class="text-xs text-slate-500 py-8 text-center">No conversations yet.</div>';
        return;
      }
      
      recentMatches.forEach(profile => {
        const matchCard = document.createElement('div');
        matchCard.className = 'flex-shrink-0 w-20 h-20 rounded-2xl overflow-hidden border-2 border-brand-500/30 hover:border-brand-500 cursor-pointer transition relative group';
        matchCard.innerHTML = `
          <img src="${profile.avatar}" alt="${profile.name}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition"></div>
          <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-brand-500"></div>
        `;
        newMatchesScroll.appendChild(matchCard);
      });
      
      // Show message threads
      recentMatches.forEach(profile => {
        const msgThread = document.createElement('div');
        msgThread.className = 'flex items-center gap-3 p-3 rounded-2xl bg-slate-900/50 hover:bg-slate-800/50 cursor-pointer transition';
        msgThread.innerHTML = `
          <img src="${profile.avatar}" alt="${profile.name}" class="w-12 h-12 rounded-full object-cover">
          <div class="flex-1 min-w-0">
            <h4 class="text-sm font-bold text-white">${profile.name}</h4>
            <p class="text-xs text-slate-400 truncate">Hey! How are you doing? 😊</p>
          </div>
          <div class="text-xs text-slate-500">Now</div>
        `;
        messagesList.appendChild(msgThread);
      });
    }

    // ========================================== 
    // MODALS & UTILITIES
    // ========================================== 
    function openPreferencesFilterModal() {
      showToast('Filter settings (demo)', 'fa-sliders', 1500);
    }

    function handleLogout() {
      appState.isLoggedIn = false;
      appState.currentUser = null;
      appState.currentCardIndex = 0;
      appState.swipeHistory = [];
      appState.matches = [];
      appState.onboardingStep = 1;
      
      switchScreen('auth');
      showToast('Logged out. See you soon! 👋', 'fa-sign-out-alt', 2000);
    }

    // ========================================== 
    // INITIALIZATION
    // ========================================== 
    document.addEventListener('DOMContentLoaded', () => {
      populateAvatarPicker();
      populateInterestTags();
      setAuthMode('signup');
    });
  </script>
</body>
</html>
