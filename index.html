                           <!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeMatch - Auth & Onboarding</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .container {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 28px;
    margin-top: 30px;
  }
  .view { display: none; }
  .view.active { display: block; }
  h2 {
    text-align: center;
    margin-top: 0;
    color: #222;
  }
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: #f0f0f0;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .tab-btn.active { background: #4f46e5; color: #fff; }
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  input {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #4f46e5; }
  button.submit-btn {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-top: 4px;
  }
  button.submit-btn:hover { background: #4338ca; }
  button.submit-btn:disabled { background: #a5a6f6; cursor: not-allowed; }
  #status-msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  #status-msg.error { color: #dc2626; }
  #status-msg.success { color: #16a34a; }

  /* Onboarding */
  .gender-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 20px 0;
  }
  .gender-btn {
    padding: 16px 10px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    color: #444;
    transition: all 0.15s ease;
  }
  .gender-btn.selected {
    border-color: #4f46e5;
    background: #eef0ff;
    color: #4f46e5;
  }
  .onboard-subtitle {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 10px;
  }

  /* Home / Dashboard */
  #home-view p { font-size: 14px; color: #333; word-break: break-all; }
  #logout-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #dc2626;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  #logout-btn:hover { background: #b91c1c; }
</style>
</head>
<body>

<div class="container">

  <!-- ===================== VIEW 1: AUTH (Login / Register) ===================== -->
  <div id="auth-view" class="view active">
    <h2>VibeMatch</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <form id="login-form" class="active">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <form id="register-form">
      <input type="text" id="register-name" placeholder="Full Name" required>
      <input type="email" id="register-email" placeholder="Email" required>
      <input type="password" id="register-password" placeholder="Password (min 6 characters)" required minlength="6">
      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div id="status-msg"></div>
  </div>

  <!-- ===================== VIEW 2: ONBOARDING (Gender Selection) ===================== -->
  <div id="onboarding-view" class="view">
    <h2>Your Profile</h2>
    <p class="onboard-subtitle">Aap apne aap ko kis roop mein identify karte hain?</p>

    <div class="gender-grid" id="gender-group">
      <button type="button" class="gender-btn" data-gender="Man" onclick="selectGender(this)">Man</button>
      <button type="button" class="gender-btn" data-gender="Woman" onclick="selectGender(this)">Woman</button>
      <button type="button" class="gender-btn" data-gender="Non-binary" onclick="selectGender(this)">Non-binary</button>
      <button type="button" class="gender-btn" data-gender="Prefer not to say" onclick="selectGender(this)">Prefer not to say</button>
    </div>

    <button type="button" class="submit-btn" id="onboarding-continue-btn" onclick="completeOnboarding()" disabled>Continue</button>
    <div id="onboarding-status"></div>
  </div>

  <!-- ===================== VIEW 3: HOME (Logged in + Onboarded) ===================== -->
  <div id="home-view" class="view">
    <h2>Welcome ✅</h2>
    <p id="home-name"></p>
    <p id="home-email"></p>
    <p id="home-gender"></p>
    <button id="logout-btn" onclick="logoutUser()">Logout</button>
  </div>

</div>

<!-- ===================== FIREBASE SDK (Compat version) ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ===================== FIREBASE CONFIG =====================
  const firebaseConfig = {
    apiKey: "AIzaSyDQ0WJ9rdfN-EETH8FnA3M_fMt8lHIpMws",
    authDomain: "dating-website-57d6b.firebaseapp.com",
    projectId: "dating-website-57d6b",
    storageBucket: "dating-website-57d6b.firebasestorage.app",
    messagingSenderId: "553397171192",
    appId: "1:553397171192:web:59a14a498c1256964b1c0d",
    measurementId: "G-RS23LS16FH"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ===================== STATE =====================
  let selectedGender = null;

  // ===================== UI ELEMENTS =====================
  const authView = document.getElementById('auth-view');
  const onboardingView = document.getElementById('onboarding-view');
  const homeView = document.getElementById('home-view');
  const statusMsg = document.getElementById('status-msg');
  const onboardingStatus = document.getElementById('onboarding-status');
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const onboardingContinueBtn = document.getElementById('onboarding-continue-btn');

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function showStatus(el, message, type) {
    el.textContent = message;
    el.className = type;
  }

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    loginForm.classList.toggle('active', tab === 'login');
    registerForm.classList.toggle('active', tab === 'register');
    statusMsg.textContent = '';
  }

  // ===================== REGISTER =====================
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('register-name').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;

    try {
      const userCredential = await auth.createUserWithEmailAndPassword(email, password);
      const user = userCredential.user;

      await db.collection('users').doc(user.uid).set({
        name: name,
        email: email,
        gender: null,
        onboardingComplete: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await user.updateProfile({ displayName: name });

      showStatus(statusMsg, 'Registration successful!', 'success');
      registerForm.reset();
    } catch (error) {
      showStatus(statusMsg, error.message, 'error');
    }
  });

  // ===================== LOGIN =====================
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    try {
      await auth.signInWithEmailAndPassword(email, password);
      showStatus(statusMsg, 'Login successful!', 'success');
      loginForm.reset();
    } catch (error) {
      showStatus(statusMsg, error.message, 'error');
    }
  });

  // ===================== LOGOUT =====================
  function logoutUser() {
    auth.signOut();
  }

  // ===================== ONBOARDING: GENDER SELECTION =====================
  function selectGender(btn) {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedGender = btn.dataset.gender;
    onboardingContinueBtn.disabled = false;
  }

  async function completeOnboarding() {
    const user = auth.currentUser;
    if (!user || !selectedGender) return;

    onboardingContinueBtn.disabled = true;
    try {
      await db.collection('users').doc(user.uid).update({
        gender: selectedGender,
        onboardingComplete: true
      });
      showHomeView(user, selectedGender);
    } catch (error) {
      showStatus(onboardingStatus, error.message, 'error');
      onboardingContinueBtn.disabled = false;
    }
  }

  function showHomeView(user, gender) {
    document.getElementById('home-name').textContent = 'Name: ' + (user.displayName || '-');
    document.getElementById('home-email').textContent = 'Email: ' + user.email;
    document.getElementById('home-gender').textContent = 'Gender: ' + (gender || '-');
    showView('home-view');
  }

  // ===================== AUTH STATE LISTENER =====================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      try {
        const docSnap = await db.collection('users').doc(user.uid).get();
        const data = docSnap.exists ? docSnap.data() : null;

        if (data && data.onboardingComplete) {
          showHomeView(user, data.gender);
        } else {
          showView('onboarding-view');
        }
      } catch (err) {
        console.error('Error fetching user data:', err);
        showView('onboarding-view');
      }
    } else {
      selectedGender = null;
      onboardingContinueBtn.disabled = true;
      document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
      showView('aauth-view');
    }
  });
</script>

</body>
</html>
